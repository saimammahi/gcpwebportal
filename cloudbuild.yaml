# Substitutions (set in the Cloud Build trigger or override with --substitutions):
#   _REGION, _AR_REPO, _SERVICE_NAME, _IMAGE_NAME
#
# Example trigger substitution values:
#   _REGION=europe-west3
#   _AR_REPO=streamlit-portal
#   _SERVICE_NAME=streamlit-portal
#   _IMAGE_NAME=streamlit-portal

substitutions:
  _REGION: europe-west3
  _AR_REPO: streamlit-portal
  _SERVICE_NAME: streamlit-portal
  _IMAGE_NAME: streamlit-portal

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}:${SHORT_SHA}"

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - "--platform"
      - "linux/amd64"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}:${SHORT_SHA}"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}:latest"
      - "."

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - "--all-tags"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}"

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "${_SERVICE_NAME}"
      - "--image"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}:${SHORT_SHA}"
      - "--region"
      - "${_REGION}"
      - "--platform"
      - managed
      - "--allow-unauthenticated"
      - "--quiet"
